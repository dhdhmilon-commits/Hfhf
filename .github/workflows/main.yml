name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded zip (if present)
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "zip ফাইল পাওয়া গেছে: $ZIP_FILE — এক্সট্র্যাক্ট করা হচ্ছে..."
            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "কোনো zip ফাইল পাওয়া যায়নি — রিপোর ফাইল সরাসরি ব্যবহার হবে।"
          fi

      - name: Locate Gradle project root
        id: locate
        run: |
          SETTINGS_FILE=$(find . -maxdepth 6 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::কোনো settings.gradle(.kts) ফাইলই পাওয়া যায়নি! রিপোতে সঠিক zip/ফাইল আপলোড হয়েছে কিনা যাচাই করুন।"
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "প্রজেক্ট রুট পাওয়া গেছে: $PROJECT_DIR"
          echo "project-dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-disabled: false

      - name: Generate debug keystore
        working-directory: ${{ steps.locate.outputs.project-dir }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project-dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluentvideo-debug-apk
          path: ${{ steps.locate.outputs.project-dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build Release APK (optional, needs secrets)
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded zip (if present)
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project
          fi

      - name: Locate Gradle project root
        id: locate
        run: |
          SETTINGS_FILE=$(find . -maxdepth 6 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::কোনো settings.gradle(.kts) ফাইলই পাওয়া যায়নি!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project-dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Decode release keystore from secret
        working-directory: ${{ steps.locate.outputs.project-dir }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project-dir }}
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fluentvideo-release-apk
          path: ${{ steps.locate.outputs.project-dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
